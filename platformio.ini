; ESP32-S3 HID Touch Injector —— 通用 USB / BLE HID 触摸注入开发板
;
; 两个构建环境:
;   env:usb  —— 原生 USB 口的 HID 复合设备(接手机),控制走 UART0
;   env:ble  —— BLE HID(HOGP)设备,手机蓝牙配对,控制同样走 UART0
;
; 用法:
;   pio run -e usb -t upload
;   pio run -e ble -t upload
;   pio device monitor -b 115200
;
; 关键编译宏:
;   ARDUINO_USB_MODE=0        → 原生 USB 由 TinyUSB 接管(而非 USB-Serial-JTAG)
;   ARDUINO_USB_CDC_ON_BOOT=0 → 原生 USB 上不开 CDC,整个口只服务于 HID

[platformio]
default_envs = usb

[env]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<common/>
; 本机实测板子:ESP32-S3 QFN56 rev0.2 + 8MB PSRAM(OPI, AP_3v3)→ 用 qio_opi
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
; 自定义分区表:给 LittleFS 留 1MB 存脚本(默认分区表没有文件系统分区)
board_build.partitions = partitions_8mb.csv
upload_speed = 921600

build_flags =
  ; loop 任务栈加大到 16KB
  ; ⚠️ Arduino 默认只有 8KB,而 WebServer 回调就跑在 loop 里。
  ;    一次 /api/save 会在栈上放 Script(48 步 = 4.9KB)+ 各种缓冲,
  ;    实测 8KB 会**栈溢出导致连接被掐断**。
  -DARDUINO_LOOP_STACK_SIZE=16384
    ; 固件版本号 —— 控制中心据此判断要不要下发 OTA
    -DFW_VERSION=\"1.3.0\"
    -DCORE_DEBUG_LEVEL=1
    -DHID_TOUCH_VID=0x303A
    -DHID_TOUCH_PID=0x4004
    ; ---- 按需打开 ----
    ; -DEJ_TOUCH_DEMO=1      ; 上电自动跑一段演示手势(默认关闭,避免误触)
    ; -DCONTROL_ON_UART1=1   ; 控制协议走 UART1(GPIO17=TX/18=RX),UART0 只留日志
    ; -DTOUCH_TIME_SCALE=1.0f
    ; 启用 PSRAM(板子是 N8R8:8MB OPI PSRAM)
    ; ⚠️ 不定义它时 esp32-hal-psram.h 会把 CONFIG_SPIRAM undef 掉:
    ;    psramFound()/ps_malloc 都当没有 PSRAM,String 上限也只有 64KB。
    ;    脚本表放在 PSRAM 里(没有 PSRAM 的板子会自动退回内部 RAM、容量缩小)
    -DBOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
;  USB HID 版本
; ---------------------------------------------------------------------------
[env:usb]
build_src_filter =
    +<common/>
    +<usb/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit TinyUSB Library @ ^3.4.0

; ---------------------------------------------------------------------------
;  BLE HID 版本
; ---------------------------------------------------------------------------
[env:ble]
build_src_filter =
    +<common/>
    +<ble/>
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0

; ---------------------------------------------------------------------------
;  上电自检环境:烧进去后会自动点屏幕四角 + 中心,用来第一眼确认坐标对不对
;  注意:它会在开机 ~1.5 秒后自动触摸屏幕,请先确认手机停在安全界面
; ---------------------------------------------------------------------------
[env:usb_touchtest]
extends = env:usb
build_flags =
    ${env:usb.build_flags}
    -DEJ_TOUCH_DEMO=1
    -DTOUCH_TIME_SCALE=2.0f
